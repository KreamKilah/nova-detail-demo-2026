name: Import NOVA V5.1 original photo set
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-originals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download own generated artworks
        env:
          POLISH_SOURCE: ${{ secrets.NOVA_V51_POLISH_URL }}
          COATING_SOURCE: ${{ secrets.NOVA_V51_COATING_URL }}
        run: |
          mkdir -p assets
          curl --fail --location --retry 2 --max-time 130 "$POLISH_SOURCE" -o /tmp/v51-polish.png
          curl --fail --location --retry 2 --max-time 130 "$COATING_SOURCE" -o /tmp/v51-coating.png
          test "$(wc -c < /tmp/v51-polish.png)" -gt 10000
          test "$(wc -c < /tmp/v51-coating.png)" -gt 10000
          file /tmp/v51-polish.png | grep -q 'PNG image'
          file /tmp/v51-coating.png | grep -q 'PNG image'
      - name: Optimize local assets
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image
          for name in ["polish","coating"]:
              im=Image.open(f"/tmp/v51-{name}.png")
              im.thumbnail((1800,1100))
              im.convert("RGB").save(f"assets/v51-{name}.webp","WEBP",quality=84,method=6)
          PY
      - name: Commit only generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/v51-polish.webp assets/v51-coating.webp
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add matching original V5.1 detailing photo set"
          git pull --rebase origin main
          git push origin HEAD:main
