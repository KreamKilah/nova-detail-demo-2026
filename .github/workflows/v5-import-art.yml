name: NOVA V5 original artwork import
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-art:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Download original image sources
        env:
          MACRO_URL: \${{ secrets.NOVA_V5_MACRO_URL }}
          INTERIOR_URL: \${{ secrets.NOVA_V5_INTERIOR_URL }}
        run: |
          mkdir -p assets
          curl --fail --location --retry 2 --max-time 130 "$MACRO_URL" -o /tmp/v5-macro.png
          curl --fail --location --retry 2 --max-time 130 "$INTERIOR_URL" -o /tmp/v5-interior.png
          test "$(wc -c < /tmp/v5-macro.png)" -gt 10000
          test "$(wc -c < /tmp/v5-interior.png)" -gt 10000
          file /tmp/v5-macro.png | grep -q 'PNG image'
          file /tmp/v5-interior.png | grep -q 'PNG image'
      - name: Convert to web-optimized assets
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image
          for key in ["macro", "interior"]:
              im=Image.open(f"/tmp/v5-{key}.png")
              im.thumbnail((1950,1200))
              im.convert("RGB").save(f"assets/v5-{key}.webp","WEBP",quality=83,method=6)
          PY
      - name: Commit permanent image assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/v5-macro.webp assets/v5-interior.webp
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Add original V5 cinematic images"
          git pull --rebase origin main
          git push origin HEAD:main
